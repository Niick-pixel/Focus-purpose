<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
  <title>Stand</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="break.css" />
  <link rel="stylesheet" href="stand.css" />
  <link rel="stylesheet" href="guide.css" />
</head>
<body>
  <div class="backdrop">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <!-- Raise / lower the desk -->
  <main class="desk-view" id="deskView">
    <svg class="desk-art" id="deskArt" aria-hidden="true"></svg>
    <p class="eyebrow" id="deskEyebrow">Standing time</p>
    <h1 class="stand-title" id="deskTitle">Raise your desk</h1>
    <p class="stand-sub" id="deskSub"></p>
    <div class="actions">
      <button class="btn primary" id="deskPrimary">I'm standing</button>
      <button class="btn alt" id="deskAlt" hidden title="A small window in the corner guides a desk-friendly routine while you work">I’m standing · Keep working</button>
    </div>
    <div class="actions quiet" id="deskSecondary"></div>
  </main>

  <!-- Guided routine -->
  <main class="exercise-view" id="exerciseView" hidden>
    <header class="ex-top">
      <p class="eyebrow" id="exEyebrow">Standing · Pelvic floor</p>
      <div class="ex-dots" id="exDots"></div>
    </header>

    <section class="ex-stage">
      <figure class="ex-figure">
        <svg id="figure" aria-hidden="true"></svg>
        <figcaption class="ex-focus" id="exFocus"></figcaption>
      </figure>
      <figure class="ex-pelvis" id="exPelvis">
        <svg id="pelvis" aria-hidden="true"></svg>
      </figure>
    </section>

    <section class="ex-text">
      <p class="ex-next" id="exNext"></p>
      <h1 class="ex-title" id="exTitle"></h1>
      <p class="ex-cue" id="exCue"></p>
      <p class="ex-count" id="exCount"></p>
      <p class="ex-how" id="exHow"></p>
    </section>

    <footer class="ex-bottom">
      <div class="ex-time"><div class="ex-time-bar" id="exBar"></div></div>
      <div class="actions quiet">
        <button class="btn" id="exPause">Pause</button>
        <button class="btn" id="exSkip">Next exercise</button>
        <button class="btn" id="exEnd">Finish routine</button>
      </div>
      <div class="actions quiet ex-extra">
        <button class="btn" id="exGuide">How to use your pelvic floor</button>
        <button class="btn" id="exMini">Continue in a mini window</button>
      </div>
      <p class="ex-note">Gentle exercises for general wellness. Stop if anything hurts, and check with a pelvic-health physiotherapist if you have pain or symptoms.</p>
    </footer>
  </main>

  <div class="guide-overlay" id="guide" hidden></div>

  <button class="voice" id="voice" title="Spoken cues" aria-label="Spoken cues" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h16v10H9l-4 4v-4H4z"/>
      <path d="M8 9h8M8 12h5"/>
    </svg>
  </button>

  <button class="mute" id="mute" title="Mute cues" aria-label="Mute sound cues">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path class="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
      <path class="cross" d="M17 9l5 6M22 9l-5 6"/>
    </svg>
  </button>

  <script src="stand/visuals.js"></script>
  <script src="stand/exercises.js"></script>
  <script src="stand/player.js"></script>
  <script src="stand/guide.js"></script>
  <script src="stand.js"></script>
</body>
</html>
