<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Desk routine</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="stand.css" />
  <link rel="stylesheet" href="mini.css" />
</head>
<body>
  <div class="card" id="card">
    <header class="bar">
      <span class="eyebrow-mini" id="eyebrow">Desk routine</span>
      <div class="dots" id="dots"></div>
      <div class="tools">
        <button class="tool" id="voice" title="Spoken cues" aria-label="Spoken cues" aria-pressed="false">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-4 4v-4H4z"/><path d="M8 9h8M8 12h5"/></svg>
        </button>
        <button class="tool" id="help" title="How to use your pelvic floor" aria-label="Pelvic floor guide">?</button>
        <button class="tool" id="full" title="Full screen" aria-label="Open full screen">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button class="tool" id="end" title="Finish routine" aria-label="Finish routine">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <div class="body">
      <div class="visual" id="visual">
        <svg id="figure" aria-hidden="true"></svg>
        <svg id="pelvis" aria-hidden="true"></svg>
      </div>
      <div class="text">
        <p class="next" id="next"></p>
        <p class="title" id="title"></p>
        <p class="cue" id="cue"></p>
        <p class="count" id="count"></p>
      </div>
    </div>

    <footer class="foot">
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <button class="ctl" id="pause" title="Pause" aria-label="Pause">
        <svg class="i-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 5l12 7-12 7z"/></svg>
      </button>
      <button class="ctl" id="skip" title="Next exercise" aria-label="Next exercise">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M5 5l10 7-10 7zM16 5h3v14h-3z"/></svg>
      </button>
    </footer>
  </div>

  <script src="stand/visuals.js"></script>
  <script src="stand/exercises.js"></script>
  <script src="stand/player.js"></script>
  <script src="mini.js"></script>
</body>
</html>
